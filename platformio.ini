; PlatformIO — vm-switcher para Waveshare ESP32-S3-Touch-LCD-7C
; Pantalla RGB paralelo 16-bit 800x480 (ST7262) + tactil GT911 (I2C) + expansor IO 0x24.
; Backend: vm-switcher-api en http://192.168.1.10:8088 (HOST Proxmox).
;
; NOTA build/flash: PlatformIO corre en la CT 100, pero la placa esta en el HOST (/dev/ttyACM1).
;   - Compilar aqui:   .pio-venv/bin/pio run -e s3-7c
;   - Flashear:        scp .pio/build/s3-7c/firmware.bin al host y usar /root/esptool-venv/bin/esptool
;     (el esptool de Debian esta roto; ver reference_esp32_s3_touch_lcd_7c)

[env:s3-7c]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Modulo WROOM-2: flash OCTAL (OPI, Macronix MX25UM 32MB) + PSRAM OCTAL 16MB (AP_1v8)
; -> memory_type = opi_opi (flash OPI + psram OPI). Con QIO el bootloader no
;    inicializa la flash octal y entra en bootloop (assert do_core_init).
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = dout
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.4.0
    bblanchon/ArduinoJson@^7.4.2

build_flags =
    -DBOARD_HAS_PSRAM
    -DLGFX_USE_V1
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=3
    -I include

; Flasheo por WiFi (OTA) una vez que el panel esta en la LAN.
[env:s3-7c-ota]
extends = env:s3-7c
upload_protocol = espota
upload_port = 192.168.1.59
